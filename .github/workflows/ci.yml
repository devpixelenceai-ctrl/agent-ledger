name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests (functional, adversarial, latency budget)
        # Shared CI runners are noisy; the latency budget is enforced at 2x there and at 50 ms locally.
        env:
          AGENT_LEDGER_BENCH_BUDGET_MS: "100"
          AGENT_LEDGER_PACKAGING_TEST: "1"
        run: python -m pytest -q -rs

  lint-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Starter policy is valid
        run: agent-ledger policy lint agent_ledger/policies/starter.toml
