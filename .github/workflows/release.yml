name: Publish to PyPI

# Publishes agent-ledger-guard to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OpenID Connect): no API token or password exists anywhere.
# One-time setup on pypi.org: add a trusted publisher for this repository, workflow
# "release.yml", environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.3.2"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before publishing
        run: |
          python -m pip install -e '.[dev]'
          AGENT_LEDGER_BENCH_ENFORCE=0 python -m pytest -q -p no:cacheprovider
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "pyproject version $version does not match tag $TAG"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agent-ledger-guard/
    permissions:
      id-token: write  # trusted publishing; this job sees no other credentials
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
