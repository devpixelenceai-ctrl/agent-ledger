[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ledger-guard"
version = "0.3.2"
description = "Tamper-evident flight recorder and policy gate for AI coding agents: Claude Code, Codex, OpenCode, Cursor, Gemini, Cline, Goose and more."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pixelence AI" }]
keywords = ["ai-agents", "claude-code", "codex", "opencode", "cursor", "gemini-cli", "cline", "goose", "audit",
            "governance", "hooks", "policy", "security"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/devpixelenceai-ctrl/agent-ledger"
Documentation = "https://github.com/devpixelenceai-ctrl/agent-ledger/blob/main/docs/agents.md"
Changelog = "https://github.com/devpixelenceai-ctrl/agent-ledger/blob/main/CHANGELOG.md"
Issues = "https://github.com/devpixelenceai-ctrl/agent-ledger/issues"
Security = "https://github.com/devpixelenceai-ctrl/agent-ledger/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "coverage>=7.4"]

[project.scripts]
agent-ledger = "agent_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["agent_ledger*"]

[tool.setuptools.package-data]
agent_ledger = ["policies/*.toml", "static/*.html", "integrations/*/*.js", "integrations/*/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bench: latency benchmark (spawns real hook processes)"]
# a deprecation in our own code fails the build instead of hiding in thousands of log lines
filterwarnings = ["error::DeprecationWarning:agent_ledger"]

[tool.coverage.run]
source = ["agent_ledger"]
branch = true
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = false
