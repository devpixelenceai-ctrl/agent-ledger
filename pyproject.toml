[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ledger"
version = "0.1.0"
description = "Tamper-evident flight recorder and policy gate for AI coding agents (Claude Code hooks first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pixelence AI" }]
keywords = ["ai-agents", "claude-code", "opencode", "audit", "governance", "hooks", "policy", "security"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "coverage>=7.4"]

[project.scripts]
agent-ledger = "agent_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["agent_ledger*"]

[tool.setuptools.package-data]
agent_ledger = ["policies/*.toml", "static/*.html", "integrations/*/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bench: latency benchmark (spawns real hook processes)"]
# a deprecation in our own code fails the build instead of hiding in thousands of log lines
filterwarnings = ["error::DeprecationWarning:agent_ledger"]

[project.urls]
Homepage = "https://github.com/devpixelenceai-ctrl/agent-ledger"
Issues = "https://github.com/devpixelenceai-ctrl/agent-ledger/issues"
Changelog = "https://github.com/devpixelenceai-ctrl/agent-ledger/blob/main/CHANGELOG.md"
Security = "https://github.com/devpixelenceai-ctrl/agent-ledger/blob/main/SECURITY.md"

[tool.coverage.run]
source = ["agent_ledger"]
branch = true
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = false
